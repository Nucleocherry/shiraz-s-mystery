<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Énigme 3 💌 - Pour Shiraz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="riddle" data-riddle-id="3">
  <div id="hearts-layer" class="hearts-layer" aria-hidden="true"></div>

  <div id="reaction-pop" class="reaction-pop" aria-hidden="true">
    <img id="reaction-img" src="" alt="" />
  </div>

  <main class="container">
    <section id="lock-screen" class="card card-enter" aria-label="Énigme 3">
      <div class="top-bar">
        <a href="menu.html" class="back-menu-btn">← Retour aux énigmes</a>
      </div>

      <div class="lock-badge" aria-hidden="true">
        <span style="font-size: 2rem;">💌</span>
      </div>

      <h2>Énigme 3 : Les 3 Enveloppes 💌</h2>
      <p class="subtitle">
        Ouvre les trois enveloppes et observe bien les <strong>mots en surbrillance</strong> pour retrouver le nom caché !
      </p>

      <!-- 3 Enveloppes cliquables -->
      <div class="envelopes-grid" aria-label="Les 3 enveloppes">
        <button type="button" class="envelope-btn active" data-env="0" aria-pressed="true">
          <span class="env-emoji">📩</span>
          <span class="env-label">Lettre 1</span>
        </button>
        <button type="button" class="envelope-btn" data-env="1" aria-pressed="false">
          <span class="env-emoji">💌</span>
          <span class="env-label">Lettre 2</span>
        </button>
        <button type="button" class="envelope-btn" data-env="2" aria-pressed="false">
          <span class="env-emoji">📨</span>
          <span class="env-label">Lettre 3</span>
        </button>
      </div>

      <!-- Zone d'affichage de la lettre ouverte -->
      <div id="letter-viewer" class="letter-paper">
        <div class="letter-header-row">
          <span id="letter-title" class="letter-tag">Enveloppe n°1</span>
          <span class="letter-stamp">💖</span>
        </div>
        <p id="letter-body" class="letter-body"></p>
      </div>

      <!-- Champ texte pour saisir la réponse -->
      <div class="text-answer-group">
        <input
          type="text"
          id="riddle3-input"
          class="text-answer-input"
          placeholder="Écris ta réponse ici..."
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
      </div>

      <p id="feedback-msg" class="feedback-msg" role="status"></p>

      <button type="button" id="unlock-btn" class="unlock-btn">
        Valider l'énigme 3
      </button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
