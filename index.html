<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pour Shiraz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="index">
  <!-- Arrière-plan de cœurs flottants en diagonale -->
  <div id="hearts-layer" class="hearts-layer" aria-hidden="true"></div>

  <!-- Réaction photo en bas à droite (Oui1-3.png / Non1-3.png) -->
  <div id="reaction-pop" class="reaction-pop" aria-hidden="true">
    <img id="reaction-img" src="" alt="" />
  </div>

  <main class="container">
    <!-- ÉCRAN 1 : MENU PRINCIPAL -->
    <section id="main-menu" class="card card-enter" aria-label="Menu principal">
      <div class="ribbon-tag">
        <span>Surprise my love</span>
      </div>

      <div class="envelope-hero" aria-hidden="true">
        <span class="sparkle-dot sparkle-1">✨</span>
        <span class="sparkle-dot sparkle-2">🌸</span>
        <svg width="58" height="58" viewBox="0 0 64 64" fill="none">
          <rect x="8" y="16" width="48" height="34" rx="9" fill="#FFFFFF" stroke="#F472B6" stroke-width="3.5"/>
          <path d="M11 20L32 36L53 20" stroke="#F472B6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M32 39.5C32 39.5 25.5 35.1 25.5 31C25.5 29 27 27.5 29 27.5C30.2 27.5 31.3 28.1 32 29.1C32.7 28.1 33.8 27.5 35 27.5C37 27.5 38.5 29 38.5 31C38.5 35.1 32 39.5 32 39.5Z" fill="#FB7185"/>
        </svg>
      </div>

      <h1 class="welcome-title">Coucou shiraz  t'es prete ?</h1>

      <button type="button" id="start-btn" class="open-main-btn">
        <span>Ouvrir</span>
      </button>
    </section>

    <!-- ÉCRAN 2 : DIGICODE D'ENTRÉE -->
    <section id="lock-screen" class="card hidden" aria-label="Écran du code secret">
      <div class="top-bar">
        <button type="button" id="back-to-welcome-btn" class="back-menu-btn">
          ← Accueil
        </button>
      </div>

      <div class="lock-badge" aria-hidden="true">
        <svg width="38" height="38" viewBox="0 0 48 48" fill="none">
          <path d="M16 21V15C16 10.5817 19.5817 7 24 7C28.4183 7 32 10.5817 32 15V21" stroke="#EC4899" stroke-width="4" stroke-linecap="round"/>
          <rect x="10" y="20" width="28" height="22" rx="8" fill="#F472B6"/>
          <path d="M24 34.5C24 34.5 18.5 30.8 18.5 27.3C18.5 25.6 19.8 24.3 21.4 24.3C22.4 24.3 23.4 24.8 24 25.7C24.6 24.8 25.6 24.3 26.6 24.3C28.2 24.3 29.5 25.6 29.5 27.3C29.5 30.8 24 34.5 24 34.5Z" fill="#FFF1F2"/>
        </svg>
      </div>

      <h2>Entre le code secret</h2>
      <p class="subtitle">
        Tape les 6 chiffres pour déverrouiller le menu des énigmes !
      </p>

      <div class="hint-pill">
        <span>Indice: La date de notre 1ere relation (selon moi)</span>
      </div>

      <div id="code-inputs" class="code-inputs">
        <input type="text" inputmode="numeric" maxlength="1" class="digit-box" aria-label="Chiffre 1" />
        <input type="text" inputmode="numeric" maxlength="1" class="digit-box" aria-label="Chiffre 2" />
        <input type="text" inputmode="numeric" maxlength="1" class="digit-box" aria-label="Chiffre 3" />
        <input type="text" inputmode="numeric" maxlength="1" class="digit-box" aria-label="Chiffre 4" />
        <input type="text" inputmode="numeric" maxlength="1" class="digit-box" aria-label="Chiffre 5" />
        <input type="text" inputmode="numeric" maxlength="1" class="digit-box" aria-label="Chiffre 6" />
      </div>

      <p id="feedback-msg" class="feedback-msg" role="status"></p>

      <div class="numpad" aria-label="Pavé numérique">
        <button type="button" class="num-btn" data-num="1">1</button>
        <button type="button" class="num-btn" data-num="2">2</button>
        <button type="button" class="num-btn" data-num="3">3</button>
        <button type="button" class="num-btn" data-num="4">4</button>
        <button type="button" class="num-btn" data-num="5">5</button>
        <button type="button" class="num-btn" data-num="6">6</button>
        <button type="button" class="num-btn" data-num="7">7</button>
        <button type="button" class="num-btn" data-num="8">8</button>
        <button type="button" class="num-btn" data-num="9">9</button>
        <button type="button" class="num-btn action-btn" id="clear-btn">Vider</button>
        <button type="button" class="num-btn" data-num="0">0</button>
        <button type="button" class="num-btn action-btn" id="back-btn">⌫</button>
      </div>

      <button type="button" id="unlock-btn" class="unlock-btn">
        Déverrouiller
      </button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
